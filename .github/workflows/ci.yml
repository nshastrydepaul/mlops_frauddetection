name: CI

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[gdrive]"
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install -e .

      - name: Configure Google Drive Credentials
        run: |
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > gdrive-creds.json

      - name: Configure DVC Remote
        run: |
          dvc remote modify storage \
          gdrive_service_account_json_file_path gdrive-creds.json

      - name: Pull DVC Data
        run: |
          dvc pull

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Format Check with Ruff
        run: |
          ruff format --check .

      - name: Type Check with mypy
        run: |
          mypy src

      - name: Run Tests with pytest
        run: |
          pytest tests/ \
          --cov=mlops_frauddetection \
          --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false