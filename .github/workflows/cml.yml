name: CML Workflow

on:
  pull_request:
    branches:
      - main
      - feature/**

jobs:
  train-and-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install -e .

      - name: Install CML
        uses: iterative/setup-cml@v2

      - name: Run Training Pipeline
        run: |
          python -m mlops_frauddetection.train_model

      - name: Create Report
        run: |
          echo "# Model Training Results" > report.md
          echo "" >> report.md
          echo "Training pipeline completed successfully." >> report.md
          echo "" >> report.md
          echo "## Generated Figures" >> report.md
          ls reports/figures >> report.md

      - name: Comment PR
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md