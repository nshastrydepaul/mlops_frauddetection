name: CML Workflow

on:
  pull_request:
    branches:
      - main
      - feature/**

  push:
    branches:
      - main
      - feature/**

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[gdrive]"
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install -e .

      - name: Configure Google Drive Credentials
        run: |
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > gdrive-creds.json

      - name: Configure DVC Remote
        run: |
          dvc remote modify storage \
          gdrive_service_account_json_file_path gdrive-creds.json

      - name: Pull DVC Data
        run: |
          dvc pull

      - name: Verify Reports Directory
        run: |
          mkdir -p reports/figures
          mkdir -p reports/monitoring

      - name: Run Training Pipeline
        run: |
          python -m mlops_frauddetection.train_model

      - name: List Generated Artifacts
        run: |
          echo "Generated report files:"
          find reports -type f

      - name: Create CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Fraud Detection Model Report" > report.md
          echo "" >> report.md

          echo "## Training Status" >> report.md
          echo "Training pipeline completed successfully." >> report.md
          echo "" >> report.md

          echo "## Experiment Information" >> report.md
          echo "- Experiment: Full Training Pipeline" >> report.md
          echo "- Framework: GitHub Actions + CML + DVC" >> report.md
          echo "- Python Version: 3.11" >> report.md
          echo "" >> report.md

          echo "## Model Classification Reports" >> report.md
          echo "" >> report.md

          for report in reports/figures/*classification_report.txt; do
            if [ -f "$report" ]; then
              echo "### $(basename $report)" >> report.md
              echo '```' >> report.md
              cat "$report" >> report.md
              echo '```' >> report.md
              echo "" >> report.md
            fi
          done

          echo "## Model Comparison Summary" >> report.md
          echo "" >> report.md

          echo "| Model | Status |" >> report.md
          echo "|---|---|" >> report.md
          echo "| Logistic Regression | Evaluated |" >> report.md
          echo "| RandomForest | Evaluated |" >> report.md
          echo "| LightGBM | Evaluated |" >> report.md
          echo "| XGBoost | Evaluated |" >> report.md
          echo "" >> report.md

          echo "## Key Visualizations" >> report.md
          echo "" >> report.md

          # Confusion matrices
          for img in reports/figures/*confusion*.png reports/figures/*cm*.png; do
            if [ -f "$img" ]; then
              echo "### $(basename $img)" >> report.md
              echo "![]($img)" >> report.md
              echo "" >> report.md
            fi
          done

          # MLflow comparison plots
          for img in reports/figures/*mlflow*.png; do
            if [ -f "$img" ]; then
              echo "### $(basename $img)" >> report.md
              echo "![]($img)" >> report.md
              echo "" >> report.md
            fi
          done

          # Fraud analysis plots
          for img in \
            reports/figures/*fraud*.png \
            reports/figures/*heatmap*.png \
            reports/figures/*class_balance*.png \
            reports/figures/*correlation*.png; do

            if [ -f "$img" ]; then
              echo "### $(basename $img)" >> report.md
              echo "![]($img)" >> report.md
              echo "" >> report.md
            fi
          done

          echo "## Monitoring Outputs" >> report.md
          echo "" >> report.md

          find reports/monitoring -type f >> report.md || true

          echo "" >> report.md
          echo "## DVC Pipeline" >> report.md
          echo "" >> report.md
          echo "- Dataset retrieved successfully from Google Drive DVC remote." >> report.md
          echo "- Models and processed datasets are version-controlled through DVC." >> report.md

          cml comment create --publish report.md

      - name: Upload CML Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cml-report-artifacts
          path: |
            report.md
            reports/figures
            reports/monitoring