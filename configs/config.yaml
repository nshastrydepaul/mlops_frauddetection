# Hydra configuration for Fraud-Anomaly Detection & Behavioral Analytics

defaults:
  - _self_
  - experiment: default_experiment

project:
  name: mlops_frauddetection
  seed: 42

data:
  raw_path: data/raw
  raw_file: data_100k.csv
  processed_path: data/processed
  test_size: 0.2
  random_state: 42

model:
  # Pipeline A (Musaddiq) — Logistic Regression
  lr:
    max_iter: 1000
    class_weight: balanced

  # Pipeline B (Israail) — Ensemble
  ensemble:
    n_estimators_rf: 200
    n_estimators_lgb: 500
    n_estimators_xgb: 500
    learning_rate: 0.05
    num_leaves: 63
    max_depth: 6
    smote_strategy: 0.3

training:
  pipeline: all
  smote: true
  cv_folds: 5
  random_state: 42
  debug: false

evaluation:
  metrics:
    - accuracy
    - f1
    - roc_auc
    - avg_precision
  cv_folds: 5

logging:
  level: INFO
  output_dir: logs

paths:
  models_dir: models
  logs_dir: logs
  figures_dir: reports/figures
  predictions_dir: predictions
